  go_module: "github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension"
  module_version: "v0.156.0"
distribution:
  required: "contrib"
  custom_build_required: false
signals:
  traces:
    supported: false
  metrics:
    supported: false
  logs:
    supported: false
dependencies:
  components: []
  platforms: []
conflicts:
  components: []
files:
  config_fragment: "config.yaml"
  test_config: "test-config.yaml"
  documentation: "README.md"
  tests: []
pipeline:
  placement: "extension"
  compatible_pipelines: []
validation:
  required_commands:
    - "health-check"
security:
  network_exposure: true
  secret_fields: []
review:
  human_gate_required: false
