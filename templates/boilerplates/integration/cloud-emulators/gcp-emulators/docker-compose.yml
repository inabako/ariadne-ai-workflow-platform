services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=${GCP_PROJECT_ID:-local-emulator-project}
      - --host-port=0.0.0.0:8085
    ports:
      - "${PUBSUB_EMULATOR_PORT:-8085}:8085"

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --project=${GCP_PROJECT_ID:-local-emulator-project}
      - --host-port=0.0.0.0:8080
    ports:
      - "${FIRESTORE_EMULATOR_PORT:-8080}:8080"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443"]
    ports:
      - "${FAKE_GCS_PORT:-4443}:4443"
