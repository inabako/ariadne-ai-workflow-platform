services:
  webapp-placeholder:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 3600"]
    environment:
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: dc=example,dc=local
      LDAP_BIND_DN_SECRET_REF: ldap.application.bind_dn
      LDAP_BIND_PASSWORD_SECRET_REF: ldap.application.password
      LDAP_USER_SEARCH_BASE: ou=people,dc=example,dc=local
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=local
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - identity_internal

  openldap:
    image: osixia/openldap:${OPENLDAP_VERSION:-1.5.0}
    restart: unless-stopped
    env_file:
      - ../../openldap/docker-compose/env.example
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example Organization}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.local}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-replace-with-secret-store-value}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-replace-with-secret-store-value}
      LDAP_TLS: ${LDAP_TLS:-false}
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    command: ["--copy-service"]
    networks:
      - identity_internal
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b \"$${LDAP_BASE_DN}\" -D \"cn=admin,$${LDAP_BASE_DN}\" -w \"$${LDAP_ADMIN_PASSWORD}\" -s base dn >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  identity_internal:
    internal: true

volumes:
  openldap_data:
  openldap_config:
