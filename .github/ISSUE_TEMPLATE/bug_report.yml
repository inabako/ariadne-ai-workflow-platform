name: Bug Report
description: Report a reproducible defect in ARIADNE.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues and discussions before opening a new report.
      options:
        - label: I have searched existing issues and discussions.
          required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: A concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Include commands, workflow names, and artifact paths when possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add test output, logs, screenshots, or review artifacts. Do not include secrets.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Tell us where you saw the problem.
      value: |
        - OS:
        - Shell:
        - Python:
        - Docker:
    validations:
      required: false
  - type: checkboxes
    id: safety-check
    attributes:
      label: Public Safety Check
      options:
        - label: I did not include secrets, customer information, private URLs, or local user paths.
          required: true
